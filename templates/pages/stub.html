<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ page_title }} - {{ facility_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css?v=63">
</head>
<body>
  <div class="app">
    {% include "partials/sidebar.html" %}

    <div class="main">
      {% with page_heading=page_title %}
        {% include "partials/topbar.html" %}
      {% endwith %}
      {% if page_subtitle %}
        <p class="page-lead">{{ page_subtitle }}</p>
      {% endif %}

      <div class="content content-no-footer">
        <section class="card">
          <div class="card-body stub-message">
            <p>この画面は準備中です。</p>
          </div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
