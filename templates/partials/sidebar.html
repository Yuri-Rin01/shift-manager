<aside class="sidebar">
  <div class="sidebar-header">
    <h1>シフト作成システム</h1>
  </div>
  <nav class="sidebar-nav">
    {% for item in sidebar_menu %}
      {% if item.children %}
        <div class="nav-group-title">{{ item.label }}</div>
        {% for child in item.children %}
          <a href="{{ child.href }}" class="nav-item nav-child{% if item.key == 'settings' %} nav-settings-child{% endif %}{% if child.active %} active{% endif %}">{{ child.label }}</a>
        {% endfor %}
      {% else %}
        <a href="{{ item.href }}" class="nav-item{% if item.active %} active{% endif %}">{{ item.label }}</a>
      {% endif %}
    {% endfor %}
  </nav>
  <div class="sidebar-footer">
    {% include "partials/login_panel.html" %}
  </div>
</aside>
<link rel="stylesheet" href="/static/css/login-panel.css?v=1">
<script src="/static/js/app-shell.js?v=1"></script>
<script src="/static/js/login-panel.js?v=1"></script>
