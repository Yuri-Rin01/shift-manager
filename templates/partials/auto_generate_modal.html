<div class="modal hidden" id="auto-generate-modal" aria-hidden="true">
  <div class="modal-backdrop" data-close-auto-generate-modal></div>
  <div class="modal-dialog modal-dialog-auto-generate" role="dialog" aria-labelledby="auto-generate-modal-title">
    <div class="modal-header">
      <div>
        <h3 id="auto-generate-modal-title">シフト自動生成</h3>
        <p class="modal-subtitle" id="auto-generate-modal-subtitle"></p>
      </div>
      <button type="button" class="modal-close" data-close-auto-generate-modal aria-label="閉じる">&times;</button>
    </div>
    <div class="modal-body">
      <p id="auto-generate-summary" class="auto-generate-summary"></p>
      <div id="auto-generate-result-summary" class="auto-generate-result-summary hidden"></div>
      <div id="auto-generate-messages-wrap" class="auto-generate-messages-wrap hidden">
        <h4 class="auto-generate-messages-title">詳細メッセージ</h4>
        <ul id="auto-generate-messages" class="auto-generate-messages"></ul>
      </div>
    </div>
    <div class="modal-footer">
      <a class="btn btn-secondary" href="/settings?panel=auto" id="auto-generate-settings-link">自動生成設定</a>
      <button type="button" class="btn btn-primary" id="auto-generate-close-btn">閉じる</button>
    </div>
  </div>
</div>
