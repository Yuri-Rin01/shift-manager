name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/windows-exe-1d12
      - main
    paths:
      - "desktop_launcher.py"
      - "shift_manager.spec"
      - "app_paths.py"
      - "main.py"
      - "requirements.txt"
      - "requirements-build.txt"
      - "packaging/**"
      - ".github/workflows/build-windows-exe.yml"
      - "static/**"
      - "templates/**"
      - "db/**"
      - "routers/**"
      - "services/**"
      - "data/**"
      - "schemas/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm shift_manager.spec
          Copy-Item packaging\README_EXE.txt dist\使い方.txt -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftManager-windows
          path: |
            dist/ShiftManager.exe
            dist/使い方.txt
          if-no-files-found: error

      - name: Update GitHub Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp packaging/pre-release-notes.md "$RUNNER_TEMP/pre-release-notes.md"
          printf '\n\nビルド: `%s`\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/pre-release-notes.md"
          gh release edit windows-exe-interview \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Windows EXE（面接提出用）" \
            --notes-file "$RUNNER_TEMP/pre-release-notes.md"
          cp packaging/README_EXE.txt dist/HowToUse.txt
          gh release upload windows-exe-interview \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/ShiftManager.exe \
            dist/HowToUse.txt
          gh release delete-asset windows-exe-interview default.txt --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset windows-exe-interview README_EXE.txt --repo "$GITHUB_REPOSITORY" --yes || true
